# Offline plumbing run on the tiny real slices built by `make slices` (missing files are skipped).
# Not an experiment: BM25/random/mock baselines only, no KG frames, no generator.
run_name: pilot_local
label: "smoke test on toy data – not a result"
seed: 42
data:
  - {path: data/slices/twowiki_relink/examples.jsonl, optional: true}
  - {path: data/slices/ragability/examples.jsonl, optional: true}
  - {path: data/slices/conflicts/examples.jsonl, optional: true}
perturbation:
  enabled: false
rerankers:
  reference: bm25
  systems:
    - {name: bm25, type: bm25}
    - {name: identity, type: identity}
    - {name: random, type: random, seeds: [42, 43, 44, 45, 46]}
    - {name: llm_judge_mock, type: llm_judge, base: bm25, top_m: 5, prompt: inter_context_v1, backend: {type: mock}}
    - {name: "oracle:drop_contradicting", type: oracle, mode: drop_contradicting, base: bm25}
metrics:
  ks: [1, 3, 5]
  reasons: []
  delta_metrics: ["recall@5", "ndcg@5", "ger_paired@5", "wfr_compat_v1"]
  report_metrics: ["recall@5", "recall@5_cond", "mrr", "fcfr_paired@5", "ger_paired@5", "wfr_compat_v1", "llm_calls"]
  bootstrap: {n_boot: 1000, alpha: 0.05}
api_log: outputs/pilot_local/api_usage.jsonl
output_dir: outputs/pilot_local
