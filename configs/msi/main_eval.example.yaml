# TEMPLATE for step 5 of the locked sequence (docs/ANNOTATION_GUIDELINES.md §12): the main evaluation
# on the MSI machine (local vLLM serving Qwen/Qwen3-8B, non-thinking). Not run in the cloud.
# Run only after main annotation is exported and the analysis plan (seeds, decoding, top_m, lambda,
# thresholds) is locked from the ENGINEERING pilot (configs/msi/engineering_pilot.yaml, pilot set).
# The main set is never used to choose prompts, policy, lambda or thresholds.
run_name: main_eval
label: "main evaluation – values must match the locked plan"
seed: 42
data:
  - {path: data/annotation/v1/gold_examples_main.jsonl}
perturbation: {enabled: false}
x-qwen: &qwen
  type: openai_compat
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8000/v1
  timeout: 120
  extra_body: {chat_template_kwargs: {enable_thinking: false}}
  sampling: {top_p: 0.8, top_k: 20, min_p: 0.0}
rerankers:
  reference: bm25
  systems:
    - {name: bm25, type: bm25}
    - {name: random, type: random, seeds: [42, 43, 44, 45, 46]}
    - {name: llm_single_passage, type: llm_judge, base: bm25, top_m: 20, prompt: single_passage_v1,
       temperature: 0.7, max_tokens: 256, seeds: [42, 43, 44, 45, 46], backend: *qwen}
    - {name: llm_inter_context, type: llm_judge, base: bm25, top_m: 20, prompt: inter_context_v1,
       context_m: 5, temperature: 0.7, max_tokens: 256, seeds: [42, 43, 44, 45, 46], backend: *qwen}
    # G2+ main settings use automatically parsed frames (S0-S2); S3 is an answer-access upper bound.
    - {name: "g2plus:S2", type: g2plus, setting: S2, kg_view: data/wikidata_view/kgview.json,
       frames: data/frames/v1/frames_main.jsonl, extractor: *qwen, fallback: *qwen,
       fallback_prompt: inter_context_v1, max_tokens: 256, temperature: 0.7, lam: 1.0}
    - {name: "g2plus:S3-upper-bound", type: g2plus, setting: S3, kg_view: data/wikidata_view/kgview.json,
       frames: data/frames/v1/frames_main.jsonl, extractor: *qwen, fallback: *qwen, temperature: 0.7, lam: 1.0}
    # Human-framed diagnostic: run separately with frames_main_human_audit.jsonl; never mixed.
metrics:
  ks: [1, 3, 5]
  reasons: [alias, historical_identity, temporal_scope, geographic_granularity, hierarchy, inverse_relation]
  delta_metrics: ["fcfr_paired@5", "ger_paired@5", "recall@5_cond", "ndcg@5_cond", "wfr_compat_v1",
                  "wfr_support_v1"]
  report_metrics: ["recall@5", "recall@5_cond", "fcfr_paired@5", "fcfr_filter", "ger_paired@5",
                   "wfr_compat_v1", "wfr_support_v1", "llm_calls", "llm_failed_calls"]
  bootstrap: {n_boot: 10000, alpha: 0.05}
api_log: logs/api_usage.jsonl
output_dir: outputs/main_eval
